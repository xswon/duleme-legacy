name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Test and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Build desktop main process
        run: npm run build:desktop-main
      - name: Bundle budget
        run: npm run check:bundle
      - name: Architecture boundaries
        run: npm run check:architecture

  desktop-package-smoke:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unsigned arm64 and x64 DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist
      - name: Mount and smoke-test native DMG
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) dmg="$(ls release/*-arm64.dmg | head -n1)" ;;
            x86_64) dmg="$(ls release/*-x64.dmg | head -n1)" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mount_point="$(mktemp -d /tmp/duleme-dmg.XXXXXX)"
          cleanup() { hdiutil detach "$mount_point" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app_path="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          python3 - "$executable" <<'PY'
          import subprocess
          import sys
          result = subprocess.run([sys.argv[1], "--smoke-test"], timeout=30, text=True, capture_output=True)
          print(result.stdout, end="")
          print(result.stderr, end="", file=sys.stderr)
          raise SystemExit(result.returncode)
          PY
