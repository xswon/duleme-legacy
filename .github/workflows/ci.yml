name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Test and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Architecture boundaries
        run: npm run check:architecture

  desktop-package-check:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-2.12.0
      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version 2.12.0 --locked
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: tauri-rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            tauri-rust-${{ runner.os }}-${{ runner.arch }}-
      - name: Test Rust RSS core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build Tauri macOS prototype
        run: cargo tauri build
      - name: Report package size
        shell: bash
        run: |
          set -euo pipefail
          app_path="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -type d -print -quit)"
          dmg_path="$(find src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          app_kb="$(du -sk "$app_path" | awk '{print $1}')"
          dmg_bytes="$(stat -f '%z' "$dmg_path")"
          {
            echo "## Tauri macOS prototype size"
            echo ""
            echo "- Runner architecture: `$(uname -m)`"
            echo "- App bundle: `$app_path` — $((app_kb / 1024)) MiB"
            echo "- DMG: `$dmg_path` — $((dmg_bytes / 1024 / 1024)) MiB"
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "$app_path" "$dmg_path"
      - name: Upload Tauri DMG
        uses: actions/upload-artifact@v4
        with:
          name: duleme-tauri-macos-${{ github.sha }}
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
