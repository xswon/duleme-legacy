name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Test and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Build desktop main process
        run: npm run build:desktop-main
      - name: Bundle budget
        run: npm run check:bundle
      - name: Architecture boundaries
        run: npm run check:architecture

  desktop-package-smoke:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build unsigned arm64 and x64 DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist
      - name: Mount and smoke-test native DMG
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64) dmg="$(ls release/*-arm64.dmg | head -n1)" ;;
            x86_64) dmg="$(ls release/*-x64.dmg | head -n1)" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mount_point="$(mktemp -d /tmp/duleme-dmg.XXXXXX)"
          cleanup() { hdiutil detach "$mount_point" -quiet || true; }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          app_path="$(find "$mount_point" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          executable="$(find "$app_path/Contents/MacOS" -maxdepth 1 -type f -perm -111 -print -quit)"
          test -n "$executable"
          result_file="/tmp/duleme-smoke-result.txt"
          rm -f "$result_file"
          python3 - "$executable" "$result_file" <<'PY'
          import os
          import pathlib
          import subprocess
          import sys
          import time

          executable = sys.argv[1]
          result_file = pathlib.Path(sys.argv[2])
          env = os.environ.copy()
          env["DULEME_SMOKE_TEST"] = "1"
          env["DULEME_SMOKE_RESULT"] = str(result_file)
          env["ELECTRON_ENABLE_LOGGING"] = "1"

          process = subprocess.Popen(
              [executable],
              env=env,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          state = "missing"
          for _ in range(30):
              if result_file.exists():
                  state = result_file.read_text().strip()
                  if state == "ok" or state.startswith("error:"):
                      break
              if process.poll() is not None:
                  break
              time.sleep(1)

          if process.poll() is None:
              process.terminate()
          try:
              stdout, stderr = process.communicate(timeout=5)
          except subprocess.TimeoutExpired:
              process.kill()
              stdout, stderr = process.communicate()

          print(stdout, end="")
          print(stderr, end="", file=sys.stderr)
          if result_file.exists():
              state = result_file.read_text().strip()
          print(f"Desktop smoke result: {state}")
          if state != "ok":
              raise SystemExit(1)
          PY
