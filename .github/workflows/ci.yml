name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Test and coverage
        run: npm run test:coverage
      - name: Build
        run: npm run build
      - name: Bundle budget
        run: npm run check:bundle
      - name: Architecture boundaries
        run: npm run check:architecture

  # Keep this context while it is required by the main ruleset. It becomes the
  # Tauri packaging gate once the minimal shell lands.
  desktop-package-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Confirm Electron beta is retired
        shell: bash
        run: |
          set -euo pipefail
          test ! -f .github/workflows/release-desktop.yml
          test ! -f electron-builder.yml
          test ! -f electron/main.mjs
          ! grep -q '"desktop:dist"' package.json
          test -f docs/BACKEND_ARCHITECTURE.md
