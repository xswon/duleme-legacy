name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Build unsigned DMGs
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run desktop:dist
      - name: Create checksums
        shell: bash
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS.txt
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: duleme-macos-${{ github.ref_name }}
          path: |
            release/*.dmg
            release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: duleme-macos-${{ github.ref_name }}
          path: release
      - name: Prepare release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 读了么 Desktop 公测版

          这是未经过 Apple Developer ID 签名和 notarization 的 macOS 公测构建。

          首次打开时，如果 macOS 阻止启动，请先尝试打开一次，然后前往：
          **系统设置 → 隐私与安全性 → 仍要打开**

          不需要运行 Terminal 命令。

          - Apple Silicon：下载 `arm64` DMG
          - Intel Mac：下载 `x64` DMG
          - 可使用 `SHA256SUMS.txt` 校验下载文件
          EOF
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          extra=()
          if [[ "$tag" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$tag"             release/*.dmg             release/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --title "读了么 $tag"             --notes-file "$RUNNER_TEMP/release-notes.md"             "${extra[@]}"
